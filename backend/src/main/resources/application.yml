spring:
  application:
    name: daylight-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

app:
  demo-owner-id: ${APP_DEMO_OWNER_ID:demo-owner}
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    owner-id: ${APP_OWNER_ID:}
    owner-token: ${APP_OWNER_TOKEN:}

delivery:
  sqs:
    enabled: ${DELIVERY_SQS_ENABLED:false}
    queue-url: ${DELIVERY_SQS_QUEUE_URL:}

notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:}
    to: ${NOTIFICATION_EMAIL_TO:}
  push:
    enabled: ${NOTIFICATION_PUSH_ENABLED:false}

scheduler:
  aws:
    enabled: ${SCHEDULER_AWS_ENABLED:false}
  group: ${SCHEDULER_GROUP:default}
  role-arn: ${SCHEDULER_ROLE_ARN:}
  queue-arn: ${SCHEDULER_QUEUE_ARN:}
  timezone: ${SCHEDULER_TIMEZONE:Asia/Seoul}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${ENVIRONMENT:local}
        node-name: ${INSTANCE_ID:local}

management:
  cloudwatch:
    metrics:
      export:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info
