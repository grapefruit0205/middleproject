spring:
  application:
    name: reminder-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

delivery:
  sqs:
    enabled: ${DELIVERY_SQS_ENABLED:false}
    queue-url: ${DELIVERY_SQS_QUEUE_URL:}

notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:}
    to: ${NOTIFICATION_EMAIL_TO:}
  push:
    enabled: ${NOTIFICATION_PUSH_ENABLED:false}
    project-id: ${NOTIFICATION_PUSH_PROJECT_ID:}
    service-account-secret-arn: ${NOTIFICATION_PUSH_SERVICE_ACCOUNT_SECRET_ARN:}

trip:
  demo-owner-id: ${TRIP_DEMO_OWNER_ID:}

app:
  transport:
    enabled: ${APP_TRANSPORT_ENABLED:false}
    secrets-secret-id: ${APP_TRANSPORT_SECRETS_SECRET_ID:reminder-platform/phase18/public-data-api-keys}
    seoul-realtime-enabled: ${APP_TRANSPORT_SEOUL_REALTIME_ENABLED:false}

scheduler:
  aws:
    enabled: ${SCHEDULER_AWS_ENABLED:false}
  group: ${SCHEDULER_GROUP:default}
  role-arn: ${SCHEDULER_ROLE_ARN:}
  queue-arn: ${SCHEDULER_QUEUE_ARN:}
  timezone: ${SCHEDULER_TIMEZONE:Asia/Seoul}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${ENVIRONMENT:local}
        node-name: ${INSTANCE_ID:local}

management:
  cloudwatch:
    metrics:
      export:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info
