="end">NAT</text></g><g id="node-acm" data-node="acm"><rect x="840" y="65" width="260" height="88" rx="10" fill="#fff" stroke="#bdcbd8" stroke-width="1.5"></rect><rect x="840" y="65" width="5" height="88" rx="2" fill="#a74472"></rect><text x="860" y="95" font-size="21" fill="#172b40" font-weight="600" text-anchor="start">ACM</text><text x="860" y="120" font-size="14" fill="#526b80" font-weight="400" text-anchor="start">인증서 ARN 참조</text><text x="1085" y="141" font-size="10" fill="#a74472" font-weight="700" text-anchor="end">TLS</text></g><g id="node-web-a" data-node="web-a"><rect x="195" y="697" width="280" height="88" rx="10" fill="#fff" stroke="#bdcbd8" stroke-width="1.5"></rect><rect x="195" y="697" width="5" height="88" rx="2" fill="#bc480f"></rect><text x="215" y="727" font-size="21" fill="#172b40" font-weight="600" text-anchor="start">WEB01 · AZ-A</text><text x="215" y="752" font-size="14" fill="#526b80" font-weight="400" text-anchor="start">Apache · ASG · IMDSv2</text><text x="460" y="773" font-size="10" fill="#bc480f" font-weight="700" text-anchor="end">WEB</text></g><g id="node-web-c" data-node="web-c"><rect x="735" y="697" width="280" height="88" rx="10" fill="#fff" stroke="#bdcbd8" stroke-width="1.5"></rect><rect x="735" y="697" width="5" height="88" rx="2" fill="#bc480f"></rect><text x="755" y="727" font-size="21" fill="#172b40" font-weight="600" text-anchor="start">WEB02 · AZ-C</text><text x="755" y="752" font-size="14" fill="#526b80" font-weight="400" text-anchor="start">Apache · ASG · IMDSv2</text><text x="1000" y="773" font-size="10" fill="#bc480f" font-weight="700" text-anchor="end">WEB</text></g><text x="150" y="987" font-size="15" fill="#385671" font-weight="600" text-anchor="start">통제 지점</text><text x="150" y="1014" font-size="13" fill="#61758a" font-weight="400" text-anchor="start">ALB SG → WEB SG : 80 허용</text><text x="150" y="1037" font-size="13" fill="#61758a" font-weight="400" text-anchor="start">관리 접속은 SSM · SSH 인바운드 없음</text><text x="635" y="987" font-size="15" fill="#385671" font-weight="600" text-anchor="start">관측과 배포</text><text x="635" y="1014" font-size="13" fill="#61758a" font-weight="400" text-anchor="start">ALB 로그 → S3 / WEB 로그 → CloudWatch</text><text x="635" y="1037" font-size="13" fill="#61758a" font-weight="400" text-anchor="start">비공개 S3의 버전별 배포 파일 사용</text><g><rect x="624.5" y="222.5" width="121" height="26" rx="6" fill="white" stroke="#dae3eb"></rect><text x="685" y="240.5" font-size="12" fill="#bc480f" font-weight="600" text-anchor="middle">01 · HTTPS 443</text></g><g><rect x="366" y="566" width="108" height="26" rx="6" fill="white" stroke="#dae3eb"></rect><text x="420" y="584" font-size="12" fill="#bc480f" font-weight="600" text-anchor="middle">02 · HTTP 80</text></g><g><rect x="741" y="566" width="108" height="26" rx="6" fill="white" stroke="#dae3eb"></rect><text x="795" y="584" font-size="12" fill="#bc480f" font-weight="600" text-anchor="middle">03 · HTTP 80</text></g><g><rect x="890.75" y="331" width="98.5" height="26" rx="6" fill="white" stroke="#dae3eb"></rect><text x="940" y="349" font-size="12" fill="#a74472" font-weight="600" text-anchor="middle">04 · 인증서</text></g><g><rect x="52.25" y="596" width="125.5" height="26" rx="6" fill="white" stroke="#dae3eb"></rect><text x="115" y="614" font-size="12" fill="#217556" font-weight="600" text-anchor="middle">05 · 외부 HTTPS</text></g></svg>