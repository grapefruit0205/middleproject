ProxyRequests Off
ProxyPass /healthz !
ProxyPass /api/ http://was:8080/api/
ProxyPassReverse /api/ http://was:8080/api/

FallbackResource /index.html

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "DENY"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"

# This config is only for the loopback-published, single-owner local service.
# Reject DNS-rebinding hosts; do not copy this no-login mode to public hosting.
<Location />
  Require expr "%{HTTP_HOST} =~ m#^(127\.0\.0\.1|localhost)(:[0-9]+)?$#i"
</Location>

<Location /api/>
  <RequireAll>
    Require expr "%{HTTP_HOST} =~ m#^(127\.0\.0\.1|localhost)(:[0-9]+)?$#i"
    Require expr "req('Origin') == '' || req('Origin') == 'http://' . req('Host')"
    Require expr "req('Sec-Fetch-Site') == '' || req('Sec-Fetch-Site') == 'same-origin'"
  </RequireAll>
  Header always set Cache-Control "no-store"
</Location>
